[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-crew"
version = "0.1.0"
description = "Local multi-profile channels for Hermes Desktop"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "pydantic>=2",
]

[project.optional-dependencies]
test = [
  "httpx",
  "pytest",
  "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend/hermes_crew_backend"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src/backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
