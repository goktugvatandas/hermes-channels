[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-channels"
version = "0.2.0"
description = "Local multi-profile channels for Hermes Desktop"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "fastapi==0.133.1",
  "pydantic>=2",
  "starlette==1.3.1",
]

[project.urls]
Repository = "https://github.com/goktugvatandas/hermes-channels"
Issues = "https://github.com/goktugvatandas/hermes-channels/issues"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest",
  "pytest-asyncio",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend/hermes_channels_backend"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src/backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "acceptance: end-to-end Hermes Channels coordination scenarios",
]
